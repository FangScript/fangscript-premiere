http:
  routers:
    api:
      rule: "PathPrefix(`/api/v1`)"
      service: gateway
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      priority: 100
    admin:
      rule: "PathPrefix(`/admin`)"
      service: admin
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      priority: 90
    portal:
      rule: "PathPrefix(`/portal`)"
      service: portal
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      priority: 90
    web:
      rule: "PathPrefix(`/`)"
      service: web
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
  services:
    gateway:
      loadBalancer:
        servers: [{url: "http://gateway:4100"}]
    admin:
      loadBalancer:
        servers: [{url: "http://admin:80"}]
    portal:
      loadBalancer:
        servers: [{url: "http://portal:80"}]
    web:
      loadBalancer:
        servers: [{url: "http://web:3000"}]
