name: fangscript
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fs_postgres_pass_2026_secure}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-fs_auth_db_pass_2026}
      DB_CMS_PASSWORD: ${DB_CMS_PASSWORD:-fs_cms_db_pass_2026}
      DB_LEAD_PASSWORD: ${DB_LEAD_PASSWORD:-fs_lead_db_pass_2026}
      DB_CRM_PASSWORD: ${DB_CRM_PASSWORD:-fs_crm_db_pass_2026}
      DB_PROJECT_PASSWORD: ${DB_PROJECT_PASSWORD:-fs_project_db_pass_2026}
      DB_FILE_PASSWORD: ${DB_FILE_PASSWORD:-fs_file_db_pass_2026}
      DB_PROPOSAL_PASSWORD: ${DB_PROPOSAL_PASSWORD:-fs_proposal_db_pass_2026}
      DB_BILLING_PASSWORD: ${DB_BILLING_PASSWORD:-fs_billing_db_pass_2026}
      DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD:-fs_notification_db_pass_2026}
      DB_AUTOMATION_PASSWORD: ${DB_AUTOMATION_PASSWORD:-fs_automation_db_pass_2026}
      DB_MARKETING_PASSWORD: ${DB_MARKETING_PASSWORD:-fs_marketing_db_pass_2026}
      DB_ANALYTICS_PASSWORD: ${DB_ANALYTICS_PASSWORD:-fs_analytics_db_pass_2026}
      DB_AUDIT_PASSWORD: ${DB_AUDIT_PASSWORD:-fs_audit_db_pass_2026}
      DB_RAG_PASSWORD: ${DB_RAG_PASSWORD:-fs_rag_db_pass_2026}
      DB_CHATBOT_PASSWORD: ${DB_CHATBOT_PASSWORD:-fs_chatbot_db_pass_2026}
      DB_AGENT_PASSWORD: ${DB_AGENT_PASSWORD:-fs_agent_db_pass_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-modules.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-fs_redis_pass_2026}"]
    volumes: ["redis-data:/data"]
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "--auth", "${NATS_TOKEN:-fs_nats_token_2026}"]
    volumes: ["nats-data:/data"]
  auth:
    build: ./services/auth
    restart: unless-stopped
    environment:
      PORT: 4200
      DATABASE_URL: postgresql://fs_auth:${DB_AUTH_PASSWORD:-fs_auth_db_pass_2026}@postgres:5432/fs_auth
      REDIS_URL: redis://:${REDIS_PASSWORD:-fs_redis_pass_2026}@redis:6379
      NATS_URL: nats://nats:4222
      NODE_ENV: ${NODE_ENV:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:-fangscript_super_secret_jwt_key_32chars_long}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-fangscript_internal_service_token_32chars}
      NATS_TOKEN: ${NATS_TOKEN:-fs_nats_token_2026}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@fangscript.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123456!Secure}
      ALLOW_ALL_ORIGINS: ${ALLOW_ALL_ORIGINS:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      nats: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  cms:
