      ANALYTICS_URL: http://analytics:4211
      AUDIT_URL: http://audit:4212
      RAG_URL: http://rag:4300
      CHATBOT_URL: http://chatbot:4300
      AGENT_URL: http://agent:4300
  web:
    build: .
    restart: unless-stopped
    ports: ["0.0.0.0:${WEB_PORT:-3001}:3000"]
    environment:
      API_GATEWAY_URL: http://gateway:4100
  admin:
    build: ./apps/admin
    restart: unless-stopped
    ports: ["0.0.0.0:4101:80"]
  portal:
    build: ./apps/portal
    restart: unless-stopped
    ports: ["0.0.0.0:4102:80"]
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    profiles: ["traefik"]
    ports: ["80:80", "443:443"]
    command:
      - --providers.file.filename=/etc/traefik/routes.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@fangscript.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    volumes:
      - ./infra/traefik/routes.yml:/etc/traefik/routes.yml:ro
      - certificates:/certificates
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    profiles: ["automation"]
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_WEBHOOK_SECRET:-fs_n8n_secret_2026}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes: ["n8n-data:/home/node/.n8n"]
  backup:
    build: ./infra/backup
    profiles: ["backup"]
    restart: on-failure
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-fs_postgres_pass_2026_secure}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  nats-data:
  certificates:
  n8n-data:
